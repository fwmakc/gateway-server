worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # не раскрываем версию nginx в заголовках и страницах ошибок
    server_tokens off;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Docker internal DNS — re-resolves every 10s for auto-discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS — validate origin against allowlist
    # Add your production domains here (uncomment and customize):
    map $http_origin $cors_valid_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        # "~^https://(.+\.)?example\.com$" "$http_origin";
        # "~^https://(.+\.)?example\.ru$" "$http_origin";
    }

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Static downloads (/uploads) get their own generous budget: a content
    # page fires a few dozen image requests at once, and the edge cache
    # below absorbs the backend cost. API writes stay on api_limit.
    limit_req_zone $binary_remote_addr zone=uploads_limit:10m rate=50r/s;
    # 429 (not the nginx default 503): throttled ≠ broken, retry-after semantics
    limit_req_status 429;

    # Edge cache for /uploads. file-server marks every response itself:
    #   public  → Cache-Control: public, max-age=PUBLIC_CACHE_TTL → cached;
    #   private → Cache-Control: private, no-store → never stored.
    # Only 200s are cached (proxy_cache_valid below): 404s (masked private
    # files) never stick, so a freshly uploaded key is visible immediately.
    proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m
                     max_size=500m inactive=60m use_temp_path=off;

    # Connection limit — prevent connection exhaustion (DDoS)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ═══════════════════════════════════════════════════════════════
    # Upstreams (resolve = auto-discover --scale replicas)
    # least_conn: send to the least-busy instance
    # max_fails/fail_timeout: remove dead instances from rotation
    # ip_hash (chat): sticky sessions for WebSocket
    # ═══════════════════════════════════════════════════════════════

    upstream auth_backend {
        zone auth_backend 64k;
        least_conn;
        server auth-server:3001 resolve max_fails=3 fail_timeout=30s;
    }

    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api-server:5000 resolve max_fails=3 fail_timeout=30s;
    }

    upstream file_backend {
        zone file_backend 64k;
        least_conn;
        server file-server:3002 resolve max_fails=3 fail_timeout=30s;
    }

    upstream msg_backend {
        zone msg_backend 64k;
        least_conn;
        server message-server:3003 resolve max_fails=3 fail_timeout=30s;
    }

    # chat_backend заморожен вместе с chat-server (см. docker-compose.override.yml):
    # upstream chat_backend {
    #     zone chat_backend 64k;
    #     ip_hash;
    #     server chat-server:3004 resolve max_fails=3 fail_timeout=30s;
    # }

    server {
        listen 80;
        server_name _;

        # Security headers (HSTS — в nginx-ssl.conf, на HTTP он бессмыслен)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # CORS — origin validated by map $cors_valid_origin (see http block)
        add_header Access-Control-Allow-Origin $cors_valid_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
        # X-Internal-Api-Key не для браузеров: межсервисный заголовок
        add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With" always;

        # --- Health check (nginx itself) ---
        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        # --- Auth server (shorter timeouts for DDoS protection) ---
        location ~ ^/(account|token|auth|\.well-known|users|roles|clients|userinfo) {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit 10;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_pass http://auth_backend;
        }

        # --- Swagger/ReDoc (auth-server by default) ---
        location ~ ^/(swagger|redoc) {
            if ($request_method = OPTIONS) { return 204; }
            # swagger дороже обычных маршрутов (генерация схемы) — режем агрессивнее
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            proxy_pass http://auth_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- File server ---
        # Точная проба хранилища для LB/ops: s3 = HeadBucket к бакету.
        location = /health/storage {
            access_log off;
            proxy_pass http://file_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
        # file-server API (upload/acl/delete) — обычный API-бюджет
        location ~ ^/files {
            if ($request_method = OPTIONS) { return 204; }
            client_max_body_size 50m;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://file_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
        # Раздача файлов (/uploads) — свой лимит + edge-кэш (см. proxy_cache_path).
        # add_header на уровне location отменяет наследование server-уровня —
        # поэтому security/CORS заголовки повторены здесь явно.
        location ~ ^/uploads {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=uploads_limit burst=100 nodelay;

            proxy_cache uploads_cache;
            proxy_cache_valid 200 10m;   # fallback: если upstream не прислал Cache-Control
            proxy_cache_lock on;         # схлопываем параллельные холодные загрузки
            proxy_cache_use_stale error timeout http_502 http_503 http_504;
            # X-Cache-Status: MISS|HIT|... — для проверки; на приватных всегда MISS
            add_header X-Cache-Status $upstream_cache_status always;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Access-Control-Allow-Origin $cors_valid_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With" always;

            # как proxy.conf, но с proxy_buffering on (include дублировал бы
            # директиву): буферизация обязательна — без неё кэш не пишется
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_pass http://file_backend;
        }

        # --- Message server: no edge routes ---
        # Mail is sent through the event bus; direct /mail/* routes are
        # internal-key-guarded and reachable only inside the backend network.
        location /mail {
            return 404;
        }

        # --- Chat server (WebSocket) — заморожен вместе с chat-server ---
        # location /socket.io/ {
        #     proxy_pass http://chat_backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # --- API server (default) ---
        # operational telemetry stays internal (prometheus scrapes in-network)
        location = /metrics {
            return 404;
        }

        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
