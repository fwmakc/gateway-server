worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Docker internal DNS — re-resolves every 10s for auto-discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ═══════════════════════════════════════════════════════════════
    # Upstreams (resolve = auto-discover --scale replicas)
    # least_conn: send to the least-busy instance
    # max_fails/fail_timeout: remove dead instances from rotation
    # ip_hash (chat): sticky sessions for WebSocket
    # ═══════════════════════════════════════════════════════════════

    upstream auth_backend {
        zone auth_backend 64k;
        least_conn;
        server auth-server:3001 resolve max_fails=3 fail_timeout=30s;
    }

    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api-server:5000 resolve max_fails=3 fail_timeout=30s;
    }

    upstream file_backend {
        zone file_backend 64k;
        least_conn;
        server file-server:3002 resolve max_fails=3 fail_timeout=30s;
    }

    upstream msg_backend {
        zone msg_backend 64k;
        least_conn;
        server message-server:3003 resolve max_fails=3 fail_timeout=30s;
    }

    upstream chat_backend {
        zone chat_backend 64k;
        ip_hash;
        server chat-server:3004 resolve max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        # CORS — reflective origin (echoes the request's Origin header).
        # For production: replace $http_origin with your exact domain,
        # e.g.: add_header Access-Control-Allow-Origin "https://app.example.com" always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With,X-Internal-Api-Key" always;

        # --- Health check (nginx itself) ---
        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        # --- Auth server ---
        location ~ ^/(account|token|auth|\.well-known) {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Swagger/ReDoc (auth-server by default) ---
        location ~ ^/(swagger|redoc) {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- File server ---
        location ~ ^/(files|uploads) {
            if ($request_method = OPTIONS) { return 204; }
            client_max_body_size 50m;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://file_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Message server ---
        location /mail {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://msg_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Chat server (WebSocket) ---
        location /socket.io/ {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API server (default) ---
        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
