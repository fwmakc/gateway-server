worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting — 10 req/s per IP, burst 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Stricter for auth — 5 req/s per IP, burst 10
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream services
    upstream auth_server {
        server auth-server:3001;
    }
    upstream api_server {
        server api-server:5000;
    }
    upstream file_server {
        server file-server:3002;
    }
    upstream message_server {
        server message-server:3003;
    }
    upstream chat_server {
        server chat-server:3004;
    }

    server {
        listen 80;
        server_name _;

        # CORS headers (applied to all proxied responses)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With" always;

        # Handle preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        # --- Auth server ---
        # Registration, login, token, OAuth, JWKS
        location ~ ^/(account|token|auth|\.well-known) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_server;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # Auth-server Swagger/Redoc
        location ~ ^/(swagger|redoc)(-json)?/?$ {
            proxy_pass http://auth_server;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- File server ---
        # Upload endpoint + static file serving
        location ~ ^/(files|uploads) {
            client_max_body_size 50m;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://file_server;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Message server ---
        # Email sending
        location /mail {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://message_server;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Chat server ---
        # WebSocket + Socket.IO
        location /socket.io/ {
            proxy_pass http://chat_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API server (default) ---
        # All other routes: posts, settings, persons, test, etc.
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_server;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
