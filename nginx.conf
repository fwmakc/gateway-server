worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name _;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With" always;

        # --- Auth server ---
        location ~ ^/(account|token|auth|\.well-known) {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=auth_limit burst=10 nodelay;
            set $backend_auth "auth-server:3001";
            proxy_pass http://$backend_auth;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location ~ ^/(swagger|redoc)(-json)?/?$ {
            if ($request_method = OPTIONS) { return 204; }
            set $backend_auth "auth-server:3001";
            proxy_pass http://$backend_auth;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- File server ---
        location ~ ^/(files|uploads) {
            if ($request_method = OPTIONS) { return 204; }
            client_max_body_size 50m;
            limit_req zone=api_limit burst=20 nodelay;
            set $backend_file "file-server:3002";
            proxy_pass http://$backend_file;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Message server ---
        location /mail {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            set $backend_msg "message-server:3003";
            proxy_pass http://$backend_msg;
            include /etc/nginx/conf.d/proxy.conf;
        }

        # --- Chat server (WebSocket) ---
        location /socket.io/ {
            set $backend_chat "chat-server:3004";
            proxy_pass http://$backend_chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API server (default) ---
        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            set $backend_api "api-server:5000";
            proxy_pass http://$backend_api;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
