name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          DB_PASSWORD=ci INTERNAL_API_KEY=ci AES_SECRET=ci docker compose -f docker-compose.yml config --quiet
          DB_PASSWORD=ci INTERNAL_API_KEY=ci AES_SECRET=ci docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
