# Prometheus scrape configuration.
# Targets are compose service DNS names on the internal docker networks.
# /metrics is not authenticated and is NOT proxied by nginx — it is only
# reachable from inside the compose networks.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: auth-server
    static_configs:
      - targets: ['auth-server:3001']

  - job_name: api-server
    static_configs:
      - targets: ['api-server:5000']

  - job_name: event-server
    static_configs:
      - targets: ['event-server:3005']

  - job_name: message-server
    static_configs:
      - targets: ['message-server:3003']

  - job_name: file-server
    static_configs:
      - targets: ['file-server:3002']
