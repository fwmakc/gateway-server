# Prometheus scrape configuration.
# Service targets resolve via Docker DNS (dns_sd_configs, A records): each
# replica of a scaled service (`docker compose up --scale api-server=2`)
# becomes its own target automatically — static DNS names would scrape one
# replica of N. The resolved container IP is the default `instance` label;
# the service name is relabeled into `service` for dashboards.
# /metrics is not authenticated and is NOT proxied by nginx — it is only
# reachable from inside the compose networks.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-services
    dns_sd_configs:
      - names: ['auth-server']
        type: A
        port: 3001
      - names: ['api-server']
        type: A
        port: 5000
      - names: ['event-server']
        type: A
        port: 3005
      - names: ['message-server']
        type: A
        port: 3003
      - names: ['file-server-metrics']
        type: A
        port: 3002
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
