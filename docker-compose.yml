services:
  # ═══════════════════════════════════════════════════════════════
  # GATEWAY
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
    depends_on:
      - auth-server
      - api-server
      # - file-server
      # - message-server
      # - chat-server
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # CORE SERVICES (stable, shared across projects)
  # ═══════════════════════════════════════════════════════════════

  # --- Auth Server (port 3001) ---
  # OAuth2 authorization server, JWT/JWKS, social login.
  # Required by all other services.
  auth-server:
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=auth-server
      - IP=0.0.0.0
      - PORT=3001
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_SERVER_URL=http://event-server:3005
      # Social SSO (set real values in production)
      - LEADER_CLIENT_ID=${LEADER_CLIENT_ID:-dummy-client-id}
      - LEADER_CLIENT_SECRET=${LEADER_CLIENT_SECRET:-dummy-client-secret}
      - LEADER_CLIENT_REDIRECT=${LEADER_CLIENT_REDIRECT:-http://localhost/auth/leader/redirect}
      - UNTI_CLIENT_ID=${UNTI_CLIENT_ID:-dummy-client-id}
      - UNTI_CLIENT_SECRET=${UNTI_CLIENT_SECRET:-dummy-client-secret}
      - UNTI_CLIENT_REDIRECT=${UNTI_CLIENT_REDIRECT:-http://localhost/auth/unti/redirect}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      - GOOGLE_CLIENT_REDIRECT=${GOOGLE_CLIENT_REDIRECT:-http://localhost/auth/google/redirect}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-dummy-client-id}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-dummy-client-secret}
      - OAUTH_CLIENT_REDIRECT=${OAUTH_CLIENT_REDIRECT:-http://localhost/auth/oauth/redirect}
      - OAUTH_SERVER=${OAUTH_SERVER:-http://auth-server:3001}
      - FORM_CONFIRM=${FORM_CONFIRM:-http://localhost/confirm}
      - FORM_CHANGE=${FORM_CHANGE:-http://localhost/change}
      - FORM_REGISTER_COMPLETE=${FORM_REGISTER_COMPLETE:-http://localhost/register/complete}
      - FORM_REGISTER=${FORM_REGISTER:-http://localhost/register}
      - FORM_CONFIRM_COMPLETE=${FORM_CONFIRM_COMPLETE:-http://localhost/confirm/complete}
      - FORM_RESET=${FORM_RESET:-http://localhost/reset}
      - FORM_RESET_COMPLETE=${FORM_RESET_COMPLETE:-http://localhost/reset/complete}
      - FORM_LOGIN=${FORM_LOGIN:-http://localhost/login}
      # SMTP (MailHog for dev; auth-server still has MailModule)
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_SECURE=
      - SMTP_SENDER_NAME=Test
      - SMTP_SENDER_EMAIL=noreply@test.local
    depends_on:
      - postgres
    restart: unless-stopped

  # --- Event Server (port 3005) ---
  # Central event broker. Webhook-based publish/subscribe.
  # Replaces Redis Streams event bus. Internal only (not in nginx).
  event-server:
    build:
      context: ../event-server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=event-server
      - IP=0.0.0.0
      - PORT=3005
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=event_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_STRICT_MODE=${EVENT_STRICT_MODE:-false}
      - WORKER_INTERVAL_MS=2000
      - WORKER_MAX_INTERVAL_MS=10000
      - CLEANUP_INTERVAL_MS=3600000
      - BATCH_SIZE=10
    depends_on:
      - postgres
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # DOMAIN SERVICE (project-specific — clone api-server per project)
  # ═══════════════════════════════════════════════════════════════

  # --- API Server (port 5000) ---
  # CRUD engine for domain entities (persons, posts, settings, etc.).
  # Clone this service for new projects and replace entities.
  api-server:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-server
      - IP=0.0.0.0
      - PORT=5000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=api_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_SERVER_URL=http://event-server:3005
    depends_on:
      - postgres
      - auth-server
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES (enable as needed)
  # ═══════════════════════════════════════════════════════════════

  # --- File Server (port 3002) ---
  # File upload, image resize, static file serving.
  # Enable if your project needs file uploads.
  file-server:
    build:
      context: ../file-server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=file-server
      - IP=0.0.0.0
      - PORT=3002
      - AUTH_SERVER_URL=http://auth-server:3001
      - UPLOADS_PATH=/app/public/uploads
      - UPLOADS_URL=/uploads
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

  # --- Message Server (port 3003) ---
  # Email sending, notifications. Subscribes to events from event-server.
  # Enable if your project needs email/notifications.
  message-server:
    build:
      context: ..
      dockerfile: message-server/Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=message-server
      - IP=0.0.0.0
      - PORT=3003
      - ROOT_PATH=.
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=message_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_SERVER_URL=http://event-server:3005
      - WEBHOOK_URL=http://message-server:3003/webhooks/events
      # Queue worker
      - WORKER_INTERVAL_MS=5000
      - WORKER_MAX_INTERVAL_MS=25000
      - BATCH_SIZE=50
      - MAIL_MAX_ATTEMPTS=5
      - MAIL_RETRY_DELAY=5
      - MAIL_CLEANUP_INTERVAL=3600000
      - MAIL_CLEANUP_MAX_AGE_DAYS=30
      # SMTP (MailHog for dev)
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=mailhog
      - SMTP_PASSWORD=mailhog
      - SMTP_SECURE=
      - SMTP_SENDER_NAME=Test
      - SMTP_SENDER_EMAIL=noreply@test.local
    depends_on:
      - postgres
      - event-server
    restart: unless-stopped

  # --- Chat Server (port 3004) ---
  # WebSocket chat (Socket.IO).
  # Enable if your project needs real-time chat.
  chat-server:
    build:
      context: ../chat-server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=chat-server
      - IP=0.0.0.0
      - PORT=3004
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_SERVER_URL=http://event-server:3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.sh/init-databases.sh:ro
    restart: unless-stopped

  # --- Redis (Socket.IO adapter for multi-instance chat-server) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # --- MailHog (dev SMTP server + web UI) ---
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
  redis_data:
