version: "3.8"

services:
  # --- Gateway ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
    depends_on:
      - auth-server
      - api-server
      - file-server
      - message-server
    restart: unless-stopped

  # --- Auth Server (port 3001) ---
  auth-server:
    build: ../auth-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - AUTH_SERVER_URL=http://auth-server:3001
    depends_on:
      - postgres
    restart: unless-stopped

  # --- API Server (port 5000) ---
  api-server:
    build: ../api-server
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=api_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - AUTH_SERVER_URL=http://auth-server:3001
    depends_on:
      - postgres
    restart: unless-stopped

  # --- File Server (port 3002) ---
  file-server:
    build: ../file-server
    environment:
      - NODE_ENV=production
      - PORT=3002
      - AUTH_SERVER_URL=http://auth-server:3001
      - UPLOADS_PATH=/app/public/uploads
      - UPLOADS_URL=/uploads
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

  # --- Message Server (port 3003) ---
  message-server:
    build: ../message-server
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AUTH_SERVER_URL=http://auth-server:3001
    restart: unless-stopped

  # --- Chat Server (port 3004) ---
  chat-server:
    build: ../chat-server
    environment:
      - NODE_ENV=production
      - PORT=3004
      - AUTH_SERVER_URL=http://auth-server:3001
    restart: unless-stopped

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # --- Redis (for Stage 9: event bus + BullMQ) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
  redis_data:
