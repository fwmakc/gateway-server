services:
  # ═══════════════════════════════════════════════════════════════
  # GATEWAY
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
    depends_on:
      - auth-server
      - api-server
      # - file-server
      # - message-server
      # - chat-server
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # CORE SERVICES (stable, shared across projects)
  # ═══════════════════════════════════════════════════════════════

  # --- Auth Server (port 3001) ---
  # OAuth2 authorization server, JWT/JWKS, social login.
  # Required by all other services.
  auth-server:
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
    environment:
      - NODE_ENV=production
      - IP=0.0.0.0
      - PORT=3001
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=true
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Social SSO (set real values in production)
      - LEADER_CLIENT_ID=${LEADER_CLIENT_ID:-dummy-client-id}
      - LEADER_CLIENT_SECRET=${LEADER_CLIENT_SECRET:-dummy-client-secret}
      - LEADER_CLIENT_REDIRECT=${LEADER_CLIENT_REDIRECT:-http://localhost/auth/leader/redirect}
      - UNTI_CLIENT_ID=${UNTI_CLIENT_ID:-dummy-client-id}
      - UNTI_CLIENT_SECRET=${UNTI_CLIENT_SECRET:-dummy-client-secret}
      - UNTI_CLIENT_REDIRECT=${UNTI_CLIENT_REDIRECT:-http://localhost/auth/unti/redirect}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      - GOOGLE_CLIENT_REDIRECT=${GOOGLE_CLIENT_REDIRECT:-http://localhost/auth/google/redirect}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-dummy-client-id}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-dummy-client-secret}
      - OAUTH_CLIENT_REDIRECT=${OAUTH_CLIENT_REDIRECT:-http://localhost/auth/oauth/redirect}
      - OAUTH_SERVER=${OAUTH_SERVER:-http://auth-server:3001}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # DOMAIN SERVICE (project-specific — clone api-server per project)
  # ═══════════════════════════════════════════════════════════════

  # --- API Server (port 5000) ---
  # CRUD engine for domain entities (persons, posts, settings, etc.).
  # Clone this service for new projects and replace entities.
  api-server:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    environment:
      - NODE_ENV=production
      - IP=0.0.0.0
      - PORT=5000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=api_server
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_SYNCHRONIZE=true
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - auth-server
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES (enable as needed)
  # ═══════════════════════════════════════════════════════════════

  # --- File Server (port 3002) ---
  # File upload, image resize, static file serving.
  # Enable if your project needs file uploads.
  file-server:
    build:
      context: ..
      dockerfile: file-server/Dockerfile
    environment:
      - NODE_ENV=production
      - IP=0.0.0.0
      - PORT=3002
      - AUTH_SERVER_URL=http://auth-server:3001
      - UPLOADS_PATH=/app/public/uploads
      - UPLOADS_URL=/uploads
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

  # --- Message Server (port 3003) ---
  # Email sending, notifications, event-driven messaging via Redis.
  # Enable if your project needs email/notifications.
  message-server:
    build:
      context: ..
      dockerfile: message-server/Dockerfile
    environment:
      - NODE_ENV=production
      - IP=0.0.0.0
      - PORT=3003
      - AUTH_SERVER_URL=http://auth-server:3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # --- Chat Server (port 3004) ---
  # WebSocket chat (Socket.IO).
  # Enable if your project needs real-time chat.
  chat-server:
    build:
      context: ..
      dockerfile: chat-server/Dockerfile
    environment:
      - NODE_ENV=production
      - IP=0.0.0.0
      - PORT=3004
      - AUTH_SERVER_URL=http://auth-server:3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  # --- Redis (event bus + job queues) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
  redis_data:
