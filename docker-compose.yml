services:
  # ═══════════════════════════════════════════════════════════════
  # GATEWAY
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      auth-server:
        condition: service_healthy
      api-server:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ═══════════════════════════════════════════════════════════════

  # One-shot job: generates the shared RS256 key pair for JWT signing.
  # Without it each auth replica mints ephemeral keys and tokens issued by
  # one replica are rejected by the others (multi-replica 401s).
  # Mount your own keys instead (read-only volume) to skip this job.
  auth-keys:
    image: node:22-alpine
    volumes:
      - auth_keys:/keys
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /keys/jwt-private.pem ] && [ -f /keys/jwt-public.pem ]; then
          echo "JWT keys already present, skipping generation"
          exit 0
        fi
        node -e "const c=require('crypto'),f=require('fs');const{publicKey,privateKey}=c.generateKeyPairSync('rsa',{modulusLength:2048});f.writeFileSync('/keys/jwt-private.pem',privateKey.export({type:'pkcs8',format:'pem'}));f.writeFileSync('/keys/jwt-public.pem',publicKey.export({type:'spki',format:'pem'}));"
        chmod 644 /keys/jwt-private.pem /keys/jwt-public.pem
        echo "JWT key pair generated"
    restart: "no"
    networks:
      - backend

  auth-server:
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - SERVICE_NAME=auth-server
      - IP=0.0.0.0
      - PORT=3001
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_NAME=auth_server
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - AES_SECRET=${AES_SECRET:?set AES_SECRET (exactly 32 chars) in .env}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      - EVENT_SERVER_URL=http://event-server:3005
      # Social SSO (set real values in production)
      - LEADER_CLIENT_ID=${LEADER_CLIENT_ID:-dummy-client-id}
      - LEADER_CLIENT_SECRET=${LEADER_CLIENT_SECRET:-dummy-client-secret}
      - LEADER_CLIENT_REDIRECT=${LEADER_CLIENT_REDIRECT:-http://localhost/auth/leader/redirect}
      - UNTI_CLIENT_ID=${UNTI_CLIENT_ID:-dummy-client-id}
      - UNTI_CLIENT_SECRET=${UNTI_CLIENT_SECRET:-dummy-client-secret}
      - UNTI_CLIENT_REDIRECT=${UNTI_CLIENT_REDIRECT:-http://localhost/auth/unti/redirect}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-dummy-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      - GOOGLE_CLIENT_REDIRECT=${GOOGLE_CLIENT_REDIRECT:-http://localhost/auth/google/redirect}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-dummy-client-id}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-dummy-client-secret}
      - OAUTH_CLIENT_REDIRECT=${OAUTH_CLIENT_REDIRECT:-http://localhost/auth/oauth/redirect}
      - OAUTH_SERVER=${OAUTH_SERVER:-http://auth-server:3001}
      - FORM_CONFIRM=${FORM_CONFIRM:-http://localhost/confirm}
      - FORM_CHANGE=${FORM_CHANGE:-http://localhost/change}
      - FORM_REGISTER_COMPLETE=${FORM_REGISTER_COMPLETE:-http://localhost/register/complete}
      - FORM_REGISTER=${FORM_REGISTER:-http://localhost/register}
      - FORM_CONFIRM_COMPLETE=${FORM_CONFIRM_COMPLETE:-http://localhost/confirm/complete}
      - FORM_RESET=${FORM_RESET:-http://localhost/reset}
      - FORM_RESET_COMPLETE=${FORM_RESET_COMPLETE:-http://localhost/reset/complete}
      - FORM_LOGIN=${FORM_LOGIN:-http://localhost/login}
      # 2FA master switch (off by default; set TWO_FACTOR_ENABLED=true for dev/e2e)
      - TWO_FACTOR_ENABLED=${TWO_FACTOR_ENABLED:-false}
      # Rate limiting (see auth-server .env.example; empty = code defaults)
      - THROTTLE_DEFAULT_TTL=${THROTTLE_DEFAULT_TTL:-}
      - THROTTLE_DEFAULT_LIMIT=${THROTTLE_DEFAULT_LIMIT:-}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-}
      - THROTTLE_AUTH_STRICT_LIMIT=${THROTTLE_AUTH_STRICT_LIMIT:-}
      - THROTTLE_TOKEN_LIMIT=${THROTTLE_TOKEN_LIMIT:-}
      # Shared rate-limit storage: set THROTTLE_STORAGE=redis when scaling
      # auth-server to multiple replicas (in-memory counters would multiply
      # the effective limits by the replica count)
      - THROTTLE_STORAGE=${THROTTLE_STORAGE:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # SMTP (set in production; MailHog in dev via override)
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-Test}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-noreply@test.local}
      # Shared RS256 keys (see auth-keys job above); without these files
      # auth falls back to ephemeral per-replica keys
      - JWT_PRIVATE_KEY_PATH=/keys/jwt-private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/jwt-public.pem
    volumes:
      - auth_keys:/keys:ro
    depends_on:
      auth-keys:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  event-server:
    build:
      context: ..
      dockerfile: event-server/Dockerfile
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - SERVICE_NAME=event-server
      - IP=0.0.0.0
      - PORT=3005
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_NAME=event_server
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      - EVENT_STRICT_MODE=${EVENT_STRICT_MODE:-false}
      - WORKER_INTERVAL_MS=500
      - WORKER_MAX_INTERVAL_MS=2000
      - CLEANUP_INTERVAL_MS=3600000
      - BATCH_SIZE=50
      - DEFAULT_HTTP_TIMEOUT_MS=10000
      - DB_POOL_MAX=50
      # Egress policy for subscriber webhook URLs (anti-SSRF):
      # internal = trusted docker network (default) | public | allowlist
      - WEBHOOK_EGRESS_MODE=${WEBHOOK_EGRESS_MODE:-internal}
      - WEBHOOK_ALLOW_HOSTS=${WEBHOOK_ALLOW_HOSTS:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # DOMAIN SERVICE
  # ═══════════════════════════════════════════════════════════════

  api-server:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - SERVICE_NAME=api-server
      - IP=0.0.0.0
      - PORT=5000
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_NAME=api_server
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      - EVENT_SERVER_URL=http://event-server:3005
    depends_on:
      pgbouncer:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES
  # ═══════════════════════════════════════════════════════════════

  file-server:
    build:
      context: ..
      dockerfile: file-server/Dockerfile
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - SERVICE_NAME=file-server
      - IP=0.0.0.0
      - PORT=3002
      - AUTH_SERVER_URL=http://auth-server:3001
      - UPLOADS_PATH=/app/public/uploads
      - UPLOADS_URL=/uploads
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - frontend
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped

  message-server:
    build:
      context: ..
      dockerfile: message-server/Dockerfile
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - SERVICE_NAME=message-server
      - IP=0.0.0.0
      - PORT=3003
      - ROOT_PATH=.
      - DB_TYPE=postgres
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_NAME=message_server
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      - EVENT_SERVER_URL=http://event-server:3005
      - WEBHOOK_URL=http://message-server:3003/webhooks/events
      # Shared HMAC secret for signed event deliveries — the SAME value goes
      # to event-server (signs) and message-server (verifies). Leave empty to
      # stay on the legacy internal-key transport. Generate: openssl rand -hex 32
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Queue worker
      - WORKER_INTERVAL_MS=5000
      - WORKER_MAX_INTERVAL_MS=25000
      - BATCH_SIZE=50
      - MAIL_MAX_ATTEMPTS=5
      - MAIL_RETRY_DELAY=5
      - MAIL_CLEANUP_INTERVAL=3600000
      - MAIL_CLEANUP_MAX_AGE_DAYS=30
      # SMTP (set in production; MailHog in dev via override)
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-Test}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-noreply@test.local}
    depends_on:
      pgbouncer:
        condition: service_healthy
      event-server:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════

  # Shared rate-limit store for auth-server (THROTTLE_STORAGE=redis) —
  # required for multi-replica auth so replicas enforce one shared limit.
  # Counters are ephemeral; persistence is intentionally off.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - AUTH_TYPE=plain
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - QUERY_TIMEOUT=10
      - SERVER_RESET_QUERY=DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # MONITORING (opt-in: COMPOSE_PROFILES=monitoring in .env or
  # docker compose --profile monitoring up -d)
  # ═══════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring
    networks:
      - frontend
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pg_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  auth_keys:
