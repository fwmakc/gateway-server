# Production nginx config with TLS termination
# Usage: mount this instead of nginx.conf
#   volumes:
#     - ./nginx-ssl.conf:/etc/nginx/nginx.conf:ro
# Requires: ./ssl/cert.pem and ./ssl/key.pem
# Generate dev certs: ./generate-self-signed-cert.sh

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS — validate origin against allowlist
    map $http_origin $cors_valid_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        # "~^https://(.+\.)?example\.com$" "$http_origin";
        # "~^https://(.+\.)?example\.ru$" "$http_origin";
    }

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upstreams
    upstream auth_backend {
        zone auth_backend 64k;
        least_conn;
        server auth-server:3001 resolve max_fails=3 fail_timeout=30s;
    }
    upstream api_backend {
        zone api_backend 64k;
        least_conn;
        server api-server:5000 resolve max_fails=3 fail_timeout=30s;
    }
    upstream file_backend {
        zone file_backend 64k;
        least_conn;
        server file-server:3002 resolve max_fails=3 fail_timeout=30s;
    }
    upstream msg_backend {
        zone msg_backend 64k;
        least_conn;
        server message-server:3003 resolve max_fails=3 fail_timeout=30s;
    }
    upstream chat_backend {
        zone chat_backend 64k;
        ip_hash;
        server chat-server:3004 resolve max_fails=3 fail_timeout=30s;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS
        add_header Access-Control-Allow-Origin $cors_valid_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type,Accept,Authorization,X-Requested-With,X-Internal-Api-Key" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        location ~ ^/(account|token|auth|\.well-known) {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location ~ ^/(swagger|redoc) {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://auth_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location ~ ^/(files|uploads) {
            if ($request_method = OPTIONS) { return 204; }
            client_max_body_size 50m;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://file_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /mail {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://msg_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }

        location /socket.io/ {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            include /etc/nginx/conf.d/proxy.conf;
        }
    }
}
