# Development override — automatically merged with docker-compose.yml
# Usage: docker compose up -d
# Production: docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  auth-server:
    environment:
      - DB_LOG=true

  # chat-server is live since wave 16 (JWT handshake, redis adapter,
  # postgres history) — the service block now lives in the base compose.
  # redis is likewise un-frozen: auth-server uses it for shared throttle
  # counters, chat-server for the WS adapter.

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend
    restart: unless-stopped
