# Development override — automatically merged with docker-compose.yml
# Usage: docker compose up -d
# Production: docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  auth-server:
    environment:
      - DB_SYNCHRONIZE=true
      - DB_LOG=true

  event-server:
    environment:
      - DB_SYNCHRONIZE=true

  api-server:
    environment:
      - DB_SYNCHRONIZE=true

  message-server:
    environment:
      - DB_SYNCHRONIZE=true

  # chat-server заморожен (v0.1.0: нет JWT на WebSocket, Redis-адаптера и
  # хранения; см. дорожную карту, волна 3). Вместе с ним заморожен redis —
  # он был нужен только chat'у. Вернуть оба при реализации MVP.

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend
    restart: unless-stopped
