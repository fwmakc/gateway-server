# Development override — automatically merged with docker-compose.yml
# Usage: docker compose up -d
# Production: docker compose -f docker-compose.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  auth-server:
    environment:
      - DB_SYNCHRONIZE=true
      - DB_LOG=true

  event-server:
    environment:
      - DB_SYNCHRONIZE=true

  api-server:
    environment:
      - DB_SYNCHRONIZE=true

  message-server:
    environment:
      - DB_SYNCHRONIZE=true

  # Chat server — incomplete (no JWT on WS, no Redis adapter)
  # Remove or complete before production use
  chat-server:
    build:
      context: ..
      dockerfile: chat-server/Dockerfile
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=chat-server
      - IP=0.0.0.0
      - PORT=3004
      - AUTH_SERVER_URL=http://auth-server:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-changeme}
      - EVENT_SERVER_URL=http://event-server:3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
